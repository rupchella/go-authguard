services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authguard
      POSTGRES_USER: authguard
      POSTGRES_PASSWORD: authguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authguard -d authguard"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
